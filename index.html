<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Te doxeo</title>
    <style>
        :root{--bg1:#6a00ff;--bg2:#9a4dff;--accent1:#00e5ff;--accent2:#00bcd4}
        html,body{height:100%;margin:0}
        body{
            background:linear-gradient(180deg,#2b004d 0%, #1a0033 100%);
            color:#fff;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            display:flex;align-items:center;justify-content:center;
        }
        .container{width:100%;max-width:980px;padding:24px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;min-height:100vh}
        .shiny-card{
            position:relative;
            width:340px;
            max-width:92%;
            padding:26px;
            border-radius:16px;
            background:linear-gradient(135deg,var(--bg1),var(--bg2));
            box-shadow:0 12px 40px rgba(90,0,120,0.55);
            color:#fff;text-align:center;overflow:hidden
        }
        .shiny-card::before{
            content:"";position:absolute;top:-40%;left:-60%;width:220%;height:220%;
            background:linear-gradient(120deg,rgba(255,255,255,0.06) 0%,rgba(255,255,255,0.18) 50%,rgba(255,255,255,0.06) 100%);
            transform:rotate(25deg);animation:shimmer 3s linear infinite;mix-blend-mode:overlay
        }
        @keyframes shimmer{0%{transform:translateX(-100%) rotate(25deg)}100%{transform:translateX(100%) rotate(25deg)}}
        h2{margin:0 0 12px 0;font-size:1.2rem}
        .message{font-size:1rem;margin-bottom:14px;position:relative;z-index:1}
        .button{
            z-index:1;position:relative;display:inline-block;padding:10px 18px;border-radius:10px;border:none;
            background:linear-gradient(180deg,var(--accent1),var(--accent2));color:#071d2e;font-weight:700;cursor:pointer;
            box-shadow:0 8px 18px rgba(0,0,0,0.28);transition:transform .12s ease,box-shadow .12s ease;
        }
        .button:active{transform:translateY(2px);box-shadow:0 4px 10px rgba(0,0,0,0.2)}
        .info-box{margin-top:12px;background:rgba(255,255,255,0.06);padding:10px;border-radius:8px;font-size:0.95rem;z-index:1;position:relative}
        .small-note{font-size:0.8rem;opacity:0.9;margin-top:10px;position:relative;z-index:1}
        @media (max-width:420px){.shiny-card{padding:18px;border-radius:12px}.button{padding:9px 14px}}
    </style>
</head>
<body>
    <div class="container">
        <div class="shiny-card" role="region" aria-labelledby="cardTitle">
            <h2 id="cardTitle">¿Quieres ser doxeado?</h2>
            <div class="message">Presiona el boton "DOXEAME" para decirte donde vives.</div>

            <button class="button" onclick="obtenerInfo()">Doxeame</button>
            <div id="info" class="info-box" aria-live="polite"></div>

            <div class="small-note">disfruta las furgonetas blancas que llegaran a tu casa✨</div>
        </div>
    </div>
    <script>
    async function obtenerInfo(){
        try{
            // Usar una API que soporte HTTPS y CORS para GitHub Pages
            const res = await fetch("https://ipapi.co/json/");
            const data = await res.json();
            document.getElementById("info").innerHTML = `
                <b>IP:</b> ${data.ip}<br>
                <b>País:</b> ${data.country_name || data.country}<br>
                <b>Ciudad:</b> ${data.city}<br>
                <b>Proveedor:</b> ${data.org || data.orgt || 'N/A'}<br>
                <b>Región:</b> ${data.region}
                <b>Plataforma:</b> <span id="dispositivo"></span>
                <b>Sistema operativo :</b> <span id="sistema"></span>
            `;
        }catch(e){
            document.getElementById("info").textContent = 'No se pudo obtener información.';
        }
    }
    function obtenerSistema() {
    const ua = navigator.userAgent;

    if (/Windows NT 10.0/i.test(ua)) return "Windows 10/11";
    if (/Windows NT 6.3/i.test(ua)) return "Windows 8.1";
    if (/Windows NT 6.1/i.test(ua)) return "Windows 7";
    if (/Android/i.test(ua)) return "Android";
    if (/iPhone|iPad|iPod/i.test(ua)) return "iOS";
    if (/Mac OS X/i.test(ua)) return "macOS";
    if (/Linux/i.test(ua)) return "Linux";

    return "Desconocido";
    }

    function obtenerDispositivo() {
        const ua = navigator.userAgent;

        if (/Android/i.test(ua)) return "Celular/Tablet Android";
        if (/iPhone/i.test(ua)) return "iPhone";
        if (/iPad/i.test(ua)) return "iPad";
        if (/Windows|Macintosh|Linux/i.test(ua)) return "PC";

        return "Desconocido";
    }

    document.getElementById("dispositivo").textContent =
        obtenerDispositivo();

    document.getElementById("sistema").textContent =
        obtenerSistema();
    </script>
</body>
</html>
